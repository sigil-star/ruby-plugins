name: Validate plugins

# Runs on every pull request, including ones from forks. It only reads the repo: no secrets,
# read-only token, and it never runs any plugin's code.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check plugins
        run: node scripts/validate.cjs
